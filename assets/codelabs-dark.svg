<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96" role="img" aria-label="CodeLabs: acessar usecodelabs.com">
  <title>CodeLabs: acessar usecodelabs.com</title>
  <defs>
    <linearGradient id="borda" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="480" y2="48">
      <stop offset="0" stop-color="#00d294" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d294"/>
      <stop offset="1" stop-color="#00d294" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 240 48" to="360 240 48" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.88" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#00d294" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00d294" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="recorte">
      <rect x="1" y="1" width="478" height="94" rx="16"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .titulo { font-size: 22px; font-weight: 700; fill: #fafafa; }
    .sub { font-size: 12.5px; fill: #a1a1aa; }
    .botao { font-size: 14px; font-weight: 700; fill: #052e1f; }
    .faixa { animation: varrer 4s ease-in-out infinite; }
    .seta { animation: empurrar 1.4s ease-in-out infinite; }
    .pulso { animation: pulsar 2s ease-out infinite; transform-origin: 99px 63px; }
    @keyframes varrer { 0% { transform: translateX(-160px) skewX(-20deg); } 55%, 100% { transform: translateX(620px) skewX(-20deg); } }
    @keyframes empurrar { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @keyframes pulsar { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }
  </style>

  <g clip-path="url(#recorte)">
    <rect width="480" height="96" fill="#09090b"/>
    <rect width="480" height="96" fill="url(#aura)"/>
    <rect class="faixa" x="0" y="-20" width="90" height="136" fill="url(#brilho)"/>
  </g>
  <rect x="1" y="1" width="478" height="94" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <rect x="1" y="1" width="478" height="94" rx="16" fill="none" stroke="url(#borda)" stroke-width="1.5"/>

  <!-- logo -->
  <rect x="20" y="20" width="56" height="56" rx="14" fill="#000" stroke="#27272a"/>
  <g transform="translate(20 20) scale(0.109375)">
    <g fill="#fafafa" transform="translate(96 159.65) scale(0.35955)">
      <path d="M160 0h210v108l-95 160 95 160v108H160L0 268Z"/>
      <path d="M690 0h200v106L635 536H435V430Z"/>
    </g>
  </g>

  <text class="titulo" x="94" y="45">CodeLabs</text>
  <circle class="pulso" cx="99" cy="63" r="3.5" fill="#00d294"/>
  <circle cx="99" cy="63" r="3.5" fill="#00d294"/>
  <text class="sub" x="110" y="67.5">Bots de Discord · Sites · Sistemas</text>

  <!-- botão -->
  <rect x="344" y="29" width="116" height="38" rx="19" fill="#00d294"/>
  <text class="botao" x="389" y="53" text-anchor="middle">Acessar</text>
  <g class="seta">
    <path d="M425 48h12m-5-5 5 5-5 5" fill="none" stroke="#052e1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
